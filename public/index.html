<title>PrioSift</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PrioSift">
<style>
/* PrioSift – gemensam formgivning */
:root{
  --surface:#ffffff; --surface-2:#eef3f6; --line:#dae4ea;
  --ink:#122029; --ink-2:#4a606f; --ink-3:#7d94a2;
  --brand:#0e7c86; --brand-dark:#0a5f67; --brand-soft:#e2f2f3;
  --night:#0e1a24; --night-2:#14313d;
  --lvl1:#c0392b; --lvl2:#e07b1f; --lvl3:#2f7dc4; --lvl4:#2b8a5a;
  --shadow:0 2px 10px rgba(18,32,41,.07), 0 12px 32px rgba(18,32,41,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-2);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
p{line-height:1.55}
a{color:var(--brand-dark)}
.muted{color:var(--ink-2)}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== publik sajt + inloggning ===== */
.site{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr .9fr;color:#fff;background:var(--night)}
@media(max-width:940px){.site{grid-template-columns:1fr}}
.site-hero{position:relative;padding:56px 56px 48px;display:flex;flex-direction:column;justify-content:space-between;
  background-image:linear-gradient(180deg,rgba(8,18,26,.72),rgba(8,18,26,.93)),var(--hero-image,none);
  background-size:cover;background-position:center;background-color:#0b1620}
.site-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 60% at 20% 10%,rgba(14,124,134,.28),transparent 70%)}
.site-hero > *{position:relative;z-index:1}
.brandline{display:flex;align-items:center;gap:14px}
.brandline img{width:52px;height:52px;border-radius:13px}
.brandline b{font-size:26px;letter-spacing:-.03em}
.site-hero h1{font-size:clamp(30px,3.6vw,46px);margin:38px 0 14px;max-width:16ch;letter-spacing:-.035em}
.site-hero p.lead{font-size:18px;color:#b9cbd5;max-width:46ch;margin:0}
.hero-points{display:flex;flex-direction:column;gap:14px;margin-top:32px}
.hero-points span{border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:15px 22px;font-size:16px;color:#e8f4f6;background:rgba(255,255,255,.06);font-weight:500;line-height:1.4;display:flex;align-items:center;gap:12px}
.hero-points span svg{flex-shrink:0;opacity:.85}
.site-hero footer{color:#5f7a89;font-size:13px;margin-top:44px;line-height:1.6}
.site-login{background:var(--surface);color:var(--ink);display:flex;align-items:flex-start;justify-content:center;padding:40px 28px;overflow-y:auto}
.login-contact{font-size:14px;color:var(--ink-2);margin-bottom:22px;font-weight:500;line-height:1.5}
.doctor-cards{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.doctor-card{flex:1;min-width:90px;background:var(--surface-2);border-radius:14px;padding:16px 12px;text-align:center;border:1px solid var(--line)}
.doctor-avatar{width:62px;height:62px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft)}
.doctor-name{font-size:13px;font-weight:650;color:var(--ink);margin:0 0 3px}
.doctor-title{font-size:11.5px;color:var(--ink-2);line-height:1.35}
/* ── Cosmic preview view ── */
.cosmic-preview-wrap{max-width:820px;margin:0 auto;padding:24px}
.cosmic-preview-wrap h2{font-size:22px;margin-bottom:6px}
.narrative-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:20px 24px;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",monospace;font-size:13.5px;line-height:1.7;color:var(--ink)}
.fhir-box{background:#0e1a24;color:#c5e3d0;border-radius:14px;padding:20px 24px;white-space:pre-wrap;font-family:ui-monospace,"SF Mono",monospace;font-size:12.5px;line-height:1.6;overflow-x:auto;margin-top:16px}
/* ── Presentation view ── */
.pres-wrap{max-width:860px;margin:0 auto;padding:24px}
.pres-slide{background:var(--surface);border-radius:20px;border:1px solid var(--line);padding:48px 52px;min-height:380px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);position:relative}
.pres-eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:14px}
.pres-title{font-size:clamp(26px,3.2vw,38px);color:var(--ink);margin:0 0 18px;max-width:18ch}
.pres-body{font-size:17px;color:var(--ink-2);line-height:1.6;max-width:56ch}
.pres-nav{display:flex;align-items:center;gap:16px;margin-top:28px}
.pres-dot{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .2s}
.pres-dot.active{background:var(--brand)}
.pres-counter{font-size:13px;color:var(--ink-3);margin-left:auto}
.login-card{width:100%;max-width:360px}
.login-card h2{font-size:24px}
.login-card label{display:block;font-weight:650;font-size:14.5px;margin:16px 0 6px}
.login-card input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16.5px;background:#fff}
.login-card input:focus{outline:none;border-color:var(--brand)}
.login-error{color:var(--lvl1);font-weight:650;min-height:22px;font-size:14.5px;margin-top:10px}

/* ===== knappar & paneler ===== */
.btn{appearance:none;border:1px solid transparent;border-radius:12px;padding:13px 20px;font-size:16.5px;
  font-weight:650;cursor:pointer;background:var(--brand);color:#fff;transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

const $ = id => document.getElementById(id);
const root = () => $('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const klockan = iso => new Date(iso).toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' });
const datum = iso => new Date(iso).toLocaleDateString('sv-SE');
const kr = n => new Intl.NumberFormat('sv-SE').format(Math.round(n)) + ' kr';
function tidsedan(iso) {
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'nyss';
  if (min < 60) return min + ' min';
  return Math.floor(min / 60) + ' tim ' + (min % 60) + ' min';
}
function toast(msg) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.opacity = '0'; }, 2400);
}
async function api(path, opts = {}) {
  if (window.PRIOSIFT_DEMO) return demoApi(path, opts);
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (res.status === 401) { if (typeof renderLanding === 'function') renderLanding(); else location.href = '/'; throw new Error('utloggad'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Fel'), { data, status: res.status });
  return data;
}
function confirmDialog(title, text, confirmLabel = 'Ja, fortsätt') {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h2 style="font-size:21px">${esc(title)}</h2>
      <p style="margin-top:0">${text}</p>
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn ghost" data-no>Avbryt</button>
        <button class="btn danger" data-yes>${esc(confirmLabel)}</button></div></div>`;
    document.body.appendChild(bg);
    bg.querySelector('[data-no]').onclick = () => { bg.remove(); resolve(false); };
    bg.querySelector('[data-yes]').onclick = () => { bg.remove(); resolve(true); };
  });
}

function icon(kind) {
  const s = ICONS[kind] || ICONS.patient;
  const bars = ['#C0392B', '#E07B1F', '#4EA8E8'].map((c, i) => {
    const half = 27 * (1 - i * 0.235) - 4.5, y = 28.5 + i * 8;
    return `<rect x="${50 - half}" y="${y}" width="${half * 2}" height="5.2" rx="2.6" fill="${c}"/>`;
  }).join('');
  const feet = {
    drop:   `<circle cx="50" cy="81.5" r="6.2" fill="#4CD994"/>`,
    lines:  [0,1,2].map(i => `<rect x="34" y="${77.5 + i*6.2}" width="32" height="3.2" rx="1.6" fill="#fff" opacity=".92"/>`).join(''),
    screen: `<rect x="31" y="75" width="38" height="15" rx="3" fill="none" stroke="#fff" stroke-width="3" opacity=".92"/>`,
    db:     [0,1,2].map(i => `<ellipse cx="50" cy="${77 + i*5.5}" rx="15" ry="4" fill="none" stroke="#fff" stroke-width="2.6" opacity=".92"/>`).join(''),
    gear:   `<circle cx="50" cy="82" r="8.5" fill="none" stroke="#fff" stroke-width="3.4" opacity=".92"/>
             <circle cx="50" cy="82" r="2.6" fill="#fff" opacity=".92"/>`
  }[s.foot];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${s.c1}"/><stop offset="1" stop-color="${s.c2}"/></linearGradient></defs>
    <rect width="100" height="100" rx="22.5" fill="url(#g)"/>
    <path d="M23 24 H77 L55.75 54.5 V70 H44.25 V54.5 Z" fill="#fff"/>${bars}${feet}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const numval = v => {
  if (v === '' || v === null || v === undefined) return null;
  const n = Number(String(v).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
};
const bandFor = (lab, n) => lab.bands.find(b => b.lt === null || n < b.lt) || lab.bands[lab.bands.length - 1];
const stepOptions = st => st.type === 'combo' ? st.questions.flatMap(q => q.options) : (st.options || []);

function maxFormScore() {
  let sum = 0;
  for (const st of FORM.steps) {
    if (!st.scored) continue;
    if (st.type === 'combo') for (const q of st.questions) sum += Math.max(...q.options.map(o => optCfg(o).points), 0);
    else if (st.type === 'multi') sum += st.options.map(o => Math.max(0, optCfg(o).points))
      .sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + b, 0);
    else sum += Math.max(...st.options.map(o => optCfg(o).points), 0);
  }
  return sum;
}
const maxLabScore = () => FORM.labs.reduce((sum, lab) => {
  const pts = labItems(lab).map(o => optCfg(o).points);
  return sum + (lab.type === 'multi'
    ? pts.map(p => Math.max(0, p)).sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + b, 0)
    : Math.max(...pts, 0));
}, 0);

function evaluate(answers, labs) {
  const breakdown = [], labBreakdown = [], redFlags = [];
  let formScore = 0, labScore = 0;
  const take = (o, stepId, stepTitle, scored) => {
    const cfg = optCfg(o), pts = scored ? cfg.points : 0;
    formScore += pts;
    breakdown.push({ stepId, stepTitle, label:o.label, points:pts, redFlag:cfg.redFlag, optionId:o.id });
    if (cfg.redFlag) redFlags.push({ stepTitle, label:o.label });
  };
  for (const st of FORM.steps) {
    if (st.type === 'combo') {
      for (const q of st.questions) {
        const o = q.options.find(x => x.id === answers[q.id]);
        if (o) take(o, st.id, q.title, st.scored);
      }
      continue;
    }
    const v = answers[st.id];
    const chosen = Array.isArray(v) ? v : (v ? [v] : []);
    for (const id of chosen) {
      const o = (st.options || []).find(x => x.id === id);
      if (o) take(o, st.id, st.title, st.scored);
    }
  }
  for (const lab of FORM.labs) {
    const v = (labs || {})[lab.id];
    if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) continue;
    let hits = [], shown = '';
    if (lab.type === 'number' || lab.type === 'number2') {
      const raw = lab.type === 'number2' ? v[lab.scoreOn] : v;
      const n = numval(raw);
      if (n === null) continue;
      hits = [bandFor(lab, n)];
      shown = lab.type === 'number2' ? `${v.sys || '?'}/${v.dia || '?'} ${lab.unit}`
                                     : `${String(raw).replace('.', ',')} ${lab.unit || ''}`.trim();
    } else {
      const ids = Array.isArray(v) ? v : [v];
      hits = ids.map(id => lab.options.find(o => o.id === id)).filter(Boolean);
      shown = hits.map(o => o.label).join(' · ');
    }
    for (const h of hits) {
      const cfg = optCfg(h);
      labScore += cfg.points;
      if (cfg.redFlag) redFlags.push({ stepTitle: lab.name, label: h.label });
    }
    labBreakdown.push({ labId:lab.id, labName:lab.name, value:shown,
      band: hits.map(h => h.label).join(' · '),
      points: hits.reduce((a, h) => a + optCfg(h).points, 0),
      redFlag: hits.some(h => optCfg(h).redFlag) });
  }
  const score = formScore + labScore, t = BOOT.thresholds;
  const level = (redFlags.length || score >= t.level1) ? 1 : score >= t.level2 ? 2 : score >= t.level3 ? 3 : 4;
  return { formScore, labScore, score, level, redFlags, breakdown, labBreakdown,
           maxScore: maxFormScore() + maxLabScore() };
}
function suggestDesk(answers) {
  const chosen = Array.isArray(answers.huvudbesvar) ? answers.huvudbesvar : [];
  const step = FORM.steps.find(s => s.id === 'huvudbesvar');
  const desks = chosen.map(id => (step.options.find(o => o.id === id) || {}).desk).filter(Boolean);
  for (const d of FORM.deskPriority) if (desks.includes(d)) return d;
  return 'medicin';
}

/* --- formulärsteg --- */
const painSelected = () => {
  const chosen = pAnswers.huvudbesvar || [];
  return chosen.some(id => FORM.painSymptoms.includes(id));
};
function stepTitle(st) {
  if (st.id === 'smarta' && !painSelected() && st.titleAlt) return st.titleAlt;
  return st.title;
}
function stepHint(st) {
  if (st.id === 'smarta' && !painSelected() && st.hintAlt) return st.hintAlt;
  return st.hint;
}
/** Steg 6b: läkemedel som är troliga utifrån valda sjukdomar hamnar först. */
function orderedOptions(st) {
  if (st.id !== 'lakemedel') return st.options;
  const sick = pAnswers.sjukdomar || [];
  const score = o => (o.for || []).some(f => sick.includes(f)) ? 0 : 1;
  return [...st.options].map((o, i) => ({ o, i, s: o.id === st.noneOption ? 2 : score(o) }))
    .sort((a, b) => a.s - b.s || a.i - b.i).map(x => x.o);
}

function paintForm() {
  const st = FORM.steps[pIdx];
  const pct = (pIdx / FORM.steps.length) * 100;
  let html = `<div class="progress"><div style="width:${pct}%"></div></div>
    <div class="step-label">Steg ${st.nr}</div>
    <h1 class="q-title">${esc(stepTitle(st))}</h1>`;
  const hint = stepHint(st);
  if (hint) html += `<p class="q-hint">${esc(hint)}</p>`;

  if (st.type === 'scale') {
    html += `<div class="scale">${st.options.map(o =>
      `<button type="button" data-opt="${o.id}" class="${pAnswers[st.id] === o.id ? 'selected' : ''}">${o.label}</button>`
      ).join('')}</div><div class="scale-legend"><span>Inga besvär</span><span>Värsta tänkbara</span></div>`;
  } else if (st.type === 'combo') {
    html += st.questions.map(q => `<div class="combo-q"><h2>${esc(q.title)}</h2>
      <div class="options">${q.options.map(o => `
        <button type="button" class="opt compact ${pAnswers[q.id] === o.id ? 'selected' : ''}"
          data-opt="${o.id}" data-q="${q.id}">
          ${o.emoji ? `<span class="emoji">${o.emoji}</span>` : ''}
          <span>${esc(o.label)}</span><span class="check"></span></button>`).join('')}</div></div>`).join('');
  } else {
    const sel = pAnswers[st.id];
    const on = id => st.type === 'multi' ? (sel || []).includes(id) : sel === id;
    const opts = orderedOptions(st);
    const sick = pAnswers.sjukdomar || [];
    html += `<div class="options ${st.columns ? 'cols' : ''}">${opts.map(o => `
      <button type="button" class="opt ${st.columns ? 'compact' : ''} ${on(o.id) ? 'selected' : ''}" data-opt="${o.id}">
        ${o.emoji ? `<span class="emoji">${o.emoji}</span>` : ''}
        <span>${esc(o.label)}</span>
        ${st.id === 'lakemedel' && (o.for || []).some(f => sick.includes(f))
          ? '<span class="tag">Troligt</span>' : ''}
        <span class="check"></span></button>`).join('')}</div>`;
  }

  const last = pIdx === FORM.steps.length - 1;
  html += `<div class="nav">
    ${pIdx > 0 ? '<button class="btn ghost" id="back">Tillbaka</button>' : ''}
    <button class="btn" id="next">${last ? 'Skicka in mina svar' : 'Nästa'}</button></div>`;

  shell(html, { title:'PrioSift', icon:'patient', narrow:true, dept:false, home:false });

  root().querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    const id = b.dataset.opt;
    if (b.dataset.q) { pAnswers[b.dataset.q] = id; paintForm(); return; }
    if (st.type === 'multi') {
      let cur = [...(pAnswers[st.id] || [])];
      cur = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
      if (st.noneOption) cur = (id === st.noneOption && cur.includes(id))
        ? [st.noneOption] : cur.filter(x => x !== st.noneOption);
      pAnswers[st.id] = cur;
      paintForm();
    } else {
      pAnswers[st.id] = id;
      paintForm();
      setTimeout(nextStep, 170);
    }
  });
  const back = $('back'); if (back) back.onclick = () => { pIdx--; paintForm(); };
  $('next').onclick = nextStep;
  window.scrollTo(0, 0);
  clearTimeout(pIdle); pIdle = setTimeout(viewPatient, 10 * 60 * 1000);
}

function nextStep() {
  const st = FORM.steps[pIdx];
  if (st.type === 'multi' && !(pAnswers[st.id] || []).length) return toast('Välj minst ett alternativ.');
  if ((st.type === 'single' || st.type === 'scale') && !pAnswers[st.id]) return toast('Välj ett alternativ.');
  if (st.type === 'combo') {
    for (const q of st.questions) if (!pAnswers[q.id]) return toast('Svara på båda frågorna.');
  }
  if (pIdx === FORM.steps.length - 1) return submitForm();
  pIdx++; paintForm();
}

/* --- provsvarsrader --- */
function labResult(lab, draft) {
  const v = draft[lab.id];
  if (lab.type === 'number' || lab.type === 'number2') {
    const n = numval(lab.type === 'number2' ? v?.[lab.scoreOn] : v);
    if (n === null) return null;
    const b = bandFor(lab, n), cfg = optCfg(b);
    return { text:`${b.label} · ${cfg.points >= 0 ? '+' : ''}${cfg.points} p${cfg.redFlag ? ' ⚠️' : ''}`,
             cls: cfg.redFlag ? 'flag' : cfg.points < 0 ? 'neg' : '' };
  }
  const sel = Array.isArray(v) ? v : (v ? [v] : []);
  if (!sel.length) return null;
  const picks = sel.map(x => lab.options.find(o => o.id === x)).filter(Boolean);
  const pts = picks.reduce((a, o) => a + optCfg(o).points, 0);
  const flag = picks.some(o => optCfg(o).redFlag);
  return { text:`${pts >= 0 ? '+' : ''}${pts} p${flag ? ' ⚠️' : ''}`, cls: flag ? 'flag' : pts < 0 ? 'neg' : '' };
}
function labRowHtml(lab, draft) {
  const v = draft[lab.id];
  let inputs = '';
  if (lab.type === 'number' || lab.type === 'number2') {
    const fields = lab.type === 'number2' ? lab.fields : [{ key:'', label:'', placeholder:lab.placeholder }];
    inputs = `<div class="lab-inputs">${fields.map(f => {
      const val = lab.type === 'number2' ? (v?.[f.key] ?? '') : (v ?? '');
      return `<label>${esc(f.label)}<input type="text" class="numfield" data-lab="${lab.id}" data-key="${f.key}"
        value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" inputmode="decimal" autocomplete="off"></label>`;
    }).join('')}</div>`;
  } else {
    const sel = Array.isArray(v) ? v : (v ? [v] : []);
    inputs = `<div class="chips">${lab.options.map(o => {
      const cfg = optCfg(o);
      return `<button type="button" class="chip-btn ${sel.includes(o.id) ? 'on' : ''} ${cfg.redFlag ? 'flag' : ''}"
        data-lab="${lab.id}" data-opt="${o.id}">${esc(o.label)}</button>`;
    }).join('')}</div>`;
  }
  const r = labResult(lab, draft);
  return `<div class="lab" id="row_${lab.id}">
    <div class="lab-head"><span class="nm">${esc(lab.name)}</span>
      ${lab.unit ? `<span class="un">${esc(lab.unit)}</span>` : ''}
      <span class="res ${r ? r.cls : ''}" id="res_${lab.id}" ${r ? '' : 'style="color:var(--ink-2);font-weight:500"'}
        >${r ? esc(r.text) : 'ej taget'}</span></div>
    ${lab.hint ? `<p class="muted" style="margin:-2px 0 8px;font-size:12.5px">${esc(lab.hint)}</p>` : ''}
    ${inputs}</div>`;
}

function wireLabs(p) {
  const preview = () => {
    const ev = evaluate(p.answers, labDraft);
    const after = levelOf(ev.level);
    $('labPreview').innerHTML = `
      <span>Med dessa provsvar: <b>${ev.score} p</b>
        <span class="muted">(formulär ${ev.formScore} ${ev.labScore >= 0 ? '+' : '−'} prover ${Math.abs(ev.labScore)})</span></span>
      <span class="minibadge" style="background:${after.color}">${after.id}</span>
      <span><strong>${esc(after.name)}</strong>${ev.level !== p.level ? ` <span class="muted">(nu nivå ${p.level})</span>` : ''}</span>`;
  };
  const wireChips = lab => {
    document.querySelectorAll(`#row_${lab.id} [data-opt]`).forEach(b => b.onclick = () => {
      const optId = b.dataset.opt;
      if (lab.type === 'single') labDraft[lab.id] = labDraft[lab.id] === optId ? undefined : optId;
      else {
        let cur = [...(labDraft[lab.id] || [])];
        cur = cur.includes(optId) ? cur.filter(x => x !== optId) : [...cur, optId];
        if (lab.noneOption) cur = (optId === lab.noneOption && cur.includes(optId))
          ? [lab.noneOption] : cur.filter(x => x !== lab.noneOption);
        labDraft[lab.id] = cur;
      }
      $('row_' + lab.id).outerHTML = labRowHtml(lab, labDraft);
      wireChips(lab); preview();
    });
  };
  for (const lab of FORM.labs) {
    if (lab.type === 'number' || lab.type === 'number2') {
      document.querySelectorAll(`#row_${lab.id} input[data-lab]`).forEach(inp => inp.oninput = () => {
        if (lab.type === 'number2') labDraft[lab.id] = { ...(labDraft[lab.id] || {}), [inp.dataset.key]: inp.value };
        else labDraft[lab.id] = inp.value;
        const r = labResult(lab, labDraft), el = $('res_' + lab.id);
        el.className = 'res ' + (r ? r.cls : '');
        el.style.cssText = r ? '' : 'color:var(--ink-2);font-weight:500';
        el.textContent = r ? r.text : 'ej taget';
        preview();
      });
    } else wireChips(lab);
  }
  preview();
  $('saveLabs').onclick = async () => {
    await api('/api/patients/' + p.id, { method:'PATCH', body: { labs: labDraft, labsBy: $('labsBy').value } });
    toast('Provsvar sparade');
    paintDetail(p.id);
  };
  $('clearLabs').onclick = () => {
    labDraft = {};
    $('labRows').innerHTML = FORM.labs.map(lab => labRowHtml(lab, labDraft)).join('');
    wireLabs(p);
  };
}

let dbSort = { key:'createdAt', dir:-1 }, dbFilter = { q:'', level:'', desk:'', status:'' };

async function viewDatabase() {
  const { patients } = await api(`/api/patients?dept=${encodeURIComponent(DEPT)}`);
  const f = dbFilter;
  let rows = patients.filter(p =>
    (!f.level || p.level === Number(f.level)) &&
    (!f.desk || p.desk === f.desk) &&
    (!f.status || p.status === f.status) &&
    (!f.q || `${p.number} ${p.namn} ${p.pnr}`.toLowerCase().includes(f.q.toLowerCase())));
  rows.sort((a, b) => {
    const k = dbSort.key;
    const va = k === 'createdAt' ? new Date(a[k]) : a[k], vb = k === 'createdAt' ? new Date(b[k]) : b[k];
    return (va > vb ? 1 : va < vb ? -1 : 0) * dbSort.dir;
  });
  const th = (key, label) => `<th data-sort="${key}">${label}<span class="arrow">${
    dbSort.key === key ? (dbSort.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`;

  const lvlCount = l => patients.filter(p => p.level === l).length;
  shell(`
    <h1 style="font-size:23px">Patientdatabas <span class="muted" style="font-weight:400;font-size:17px">${esc(deptName(DEPT))}</span></h1>
    <div class="stats">
      <div class="stat"><div class="n">${patients.length}</div><div class="l">Registrerade totalt</div></div>
      ${FORM.levels.map(l => `<div class="stat" style="border-left:6px solid ${l.color}">
        <div class="n">${lvlCount(l.id)}</div><div class="l">Nivå ${l.id} · ${esc(l.name)}</div></div>`).join('')}
    </div>
    <div class="panel" style="margin-bottom:16px">
      <div class="row">
        <input class="field grow" id="q" placeholder="Sök på nummer, namn eller personnummer" value="${esc(f.q)}" style="min-width:220px">
        <select class="field" id="fLevel" style="width:auto"><option value="">Alla nivåer</option>
          ${FORM.levels.map(l => `<option value="${l.id}" ${f.level == l.id ? 'selected' : ''}>Nivå ${l.id}</option>`).join('')}</select>
        <select class="field" id="fDesk" style="width:auto"><option value="">Alla diskar</option>
          ${FORM.desks.map(d => `<option value="${d.id}" ${f.desk === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
        <select class="field" id="fStatus" style="width:auto"><option value="">Alla status</option>
          <option value="vantar" ${f.status === 'vantar' ? 'selected' : ''}>Väntar</option>
          <option value="triagerad" ${f.status === 'triagerad' ? 'selected' : ''}>Triagerad</option>
          <option value="klar" ${f.status === 'klar' ? 'selected' : ''}>Avslutad</option></select>
        <button class="btn ghost small" id="csv">Exportera CSV</button>
      </div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr>${th('number','Nummer')}${th('createdAt','Inskrivet')}${th('level','Nivå')}${th('desk','Disk')}
        ${th('score','Poäng')}${th('status','Status')}<th>Beslut</th><th>Röda flaggor</th><th></th></tr></thead>
      <tbody>${rows.length ? rows.map(p => {
        const l = levelOf(p.level), d = deskOf(p.desk);
        return `<tr>
          <td><strong>${esc(p.number)}</strong></td>
          <td>${datum(p.createdAt)} ${klockan(p.createdAt)}</td>
          <td><span class="minibadge" style="background:${l.color};width:26px;height:26px;font-size:13px">${l.id}</span></td>
          <td><span class="chip desk" style="background:${d.color}">${esc(d.name)}</span></td>
          <td class="num">${p.score}</td>
          <td>${p.status === 'klar' ? 'Avslutad' : p.status === 'triagerad' ? 'Triagerad' : 'Väntar'}</td>
          <td>${esc({ inlaggning:'Inläggning', 'inväntar_prov':'Inväntar prov', lakare:'Till läkare', hemgang:'Hemgång' }[p.decision] || '–')}</td>
          <td>${p.redFlags.length ? `<span class="chip flag">${p.redFlags.length}</span>` : '–'}</td>
          <td><button class="btn ghost small" data-open="${p.id}">Öppna</button>
              ${isOwner() ? `<button class="btn danger small" data-del="${p.id}">Radera</button>` : ''}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="9" class="empty">Inga patienter matchar filtret.</td></tr>'}</tbody>
    </table></div>
    <p class="muted" style="font-size:13px;margin-top:14px">
      Radering tar bort patienten och alla svar permanent. Enligt patientdatalagen ska gallring ske
      enligt fastställd rutin — logga vem som raderar innan detta används skarpt.</p>`,
    { title:'PrioSift Patientdatabas', icon:'databas' });

  const upd = () => { dbFilter = { q:$('q').value, level:$('fLevel').value, desk:$('fDesk').value, status:$('fStatus').value }; viewDatabase(); };
  $('q').oninput = () => { clearTimeout(window._dbt); window._dbt = setTimeout(upd, 350); };
  ['fLevel','fDesk','fStatus'].forEach(i => $(i).onchange = upd);
  document.querySelectorAll('[data-sort]').forEach(t => t.onclick = () => {
    const k = t.dataset.sort;
    dbSort = { key:k, dir: dbSort.key === k ? -dbSort.dir : -1 };
    viewDatabase();
  });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { sCurrent = b.dataset.open; go('/personal'); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const p = patients.find(x => x.id === b.dataset.del);
    if (!await confirmDialog('Radera patient?',
      `Patient <strong>${esc(p.number)}</strong> och alla svar tas bort permanent. Det går inte att ångra.`,
      'Radera permanent')) return;
    await api('/api/patients/' + b.dataset.del, { method:'DELETE' });
    toast('Patienten raderad');
    viewDatabase();
  });
  $('csv').onclick = async () => {
    const head = ['Nummer','Inskrivet','Nivå','Disk','Formulärpoäng','Provpoäng','Totalpoäng','Status','Beslut','Röda flaggor'];
    const body = rows.map(p => [p.number, p.createdAt, p.level, deskOf(p.desk).name, p.formScore, p.labScore,
      p.score, p.status, p.decision || '', p.redFlags.length]);
    const csv = '\ufeff' + [head, ...body].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
    const filename = `priosift-${DEPT}-${new Date().toISOString().slice(0,10)}.csv`;
    if (window.PRIOSIFT_DEMO) {                       // demon sparar via värdmiljön
      try {
        const dl = await window.claude?.use?.('downloads');
        if (dl) { await dl.save({ filename, data: csv }); return; }
      } catch (e) {}
      return toast('CSV-export fungerar i serverversionen på din egen domän.');
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
    a.download = filename;
    a.click();
  };
}

let cfgDirty = { overrides:{}, thresholds:null };

function viewSettings() {
  if (!isOwner()) return go('/');
  const t = { ...BOOT.thresholds, ...(cfgDirty.thresholds || {}) };
  const maxF = maxFormScore(), maxL = maxLabScore(), max = maxF + maxL;
  const val = (o, key) => cfgDirty.overrides[o.id]?.[key] ?? optCfg(o)[key];
  const bar = () => {
    const seg = [
      [FORM.levels[3].color, t.level3, `Nivå 4 (0–${t.level3 - 1})`],
      [FORM.levels[2].color, t.level2 - t.level3, `Nivå 3 (${t.level3}–${t.level2 - 1})`],
      [FORM.levels[1].color, t.level1 - t.level2, `Nivå 2 (${t.level2}–${t.level1 - 1})`],
      [FORM.levels[0].color, max - t.level1, `Nivå 1 (${t.level1}+)`]
    ];
    return `<div class="scalebar">${seg.map(([c, w, txt]) =>
      `<div style="background:${c};flex:${Math.max(w, .4)}">${w / max > .13 ? txt : ''}</div>`).join('')}</div>`;
  };
  const optRow = (o, min) => `<div class="opt-row">
    <div>${o.emoji ? o.emoji + ' ' : ''}${esc(o.label)}</div>
    <div class="slider-wrap">
      <input type="range" min="${min}" max="10" step="1" value="${val(o,'points')}" data-pts="${o.id}">
      <span class="pts-badge" id="badge_${o.id}">${min < 0 && val(o,'points') > 0 ? '+' : ''}${val(o,'points')}</span></div>
    <label class="flagtoggle"><input type="checkbox" data-flag="${o.id}" ${val(o,'redFlag') ? 'checked' : ''}> Röd flagga</label>
  </div>`;

  shell(`
    <h1 style="font-size:23px">Poäng och nivåer</h1>
    <div class="panel" style="margin-bottom:20px"><h3>Tröskelvärden</h3>
      <p class="muted" style="margin:-6px 0 14px">Formulärets svar (max ${maxF} p) plus provsvaren (max ${maxL} p)
        ger totalpoängen. En <strong>röd flagga</strong> ger alltid nivå 1.</p>
      <div id="barWrap">${bar()}</div>
      <div style="margin-top:16px">
        ${[['level1',0,'Nivå 1 · Omedelbar från'],['level2',1,'Nivå 2 · Brådskande från'],['level3',2,'Nivå 3 · Kan vänta från']]
          .map(([k, i, label]) => `<div class="thr-row">
            <div class="thr-name"><span class="dot" style="background:${FORM.levels[i].color}"></span>${label}</div>
            <input type="range" min="1" max="${max}" value="${t[k]}" data-thr="${k}">
            <div class="pts-badge" id="thr_${k}">${t[k]} p</div></div>`).join('')}
      </div></div>

    <h2 style="font-size:19px">Poäng per svar i formuläret</h2>
    <p class="muted" style="margin:-8px 0 14px">0–10 poäng per svar.</p>
    ${FORM.steps.filter(s => s.scored).map(st => st.type === 'combo'
      ? st.questions.map(q => `<div class="panel setting-step"><h4>${esc(q.title)}</h4>
          ${q.options.map(o => optRow(o, 0)).join('')}</div>`).join('')
      : `<div class="panel setting-step"><h4>Steg ${st.nr} · ${esc(st.title)}</h4>
          ${st.options.map(o => optRow(o, 0)).join('')}</div>`).join('')}

    <h2 style="font-size:19px;margin-top:26px">Poäng för provsvar</h2>
    <p class="muted" style="margin:-8px 0 14px">−10 till +10. Normala värden får ge minuspoäng.</p>
    ${FORM.labs.map(lab => `<div class="panel setting-step">
      <h4>${esc(lab.name)}${lab.unit ? ` <span class="muted" style="font-weight:400;font-size:14px">${esc(lab.unit)}</span>` : ''}</h4>
      ${labItems(lab).map(o => optRow(o, -10)).join('')}</div>`).join('')}

    <div class="savebar">
      <button class="btn" id="saveCfg">Spara inställningar</button>
      <label class="flagtoggle"><input type="checkbox" id="recalc" checked> Räkna om alla patienter</label>
      <button class="btn ghost small" id="resetCfg">Återställ standardvärden</button>
      <span class="spacer"></span><button class="btn ghost small" id="toStaff">Till patientkön</button>
    </div>`,
    { title:'PrioSift Inställningar', icon:'personal', dept:false });

  document.querySelectorAll('[data-pts]').forEach(r => r.oninput = () => {
    const id = r.dataset.pts, n = Number(r.value);
    cfgDirty.overrides[id] = { ...(cfgDirty.overrides[id] || {}), points:n };
    $('badge_' + id).textContent = (r.min === '-10' && n > 0 ? '+' : '') + n;
  });
  document.querySelectorAll('[data-flag]').forEach(c => c.onchange = () => {
    cfgDirty.overrides[c.dataset.flag] = { ...(cfgDirty.overrides[c.dataset.flag] || {}), redFlag:c.checked };
  });
  document.querySelectorAll('[data-thr]').forEach(r => r.oninput = () => {
    cfgDirty.thresholds = { ...t, ...(cfgDirty.thresholds || {}), [r.dataset.thr]: Number(r.value) };
    Object.assign(t, cfgDirty.thresholds);
    $('thr_' + r.dataset.thr).textContent = r.value + ' p';
    $('barWrap').innerHTML = bar();
  });
  $('saveCfg').onclick = async () => {
    const all = [...FORM.steps.flatMap(stepOptions), ...FORM.labs.flatMap(labItems)];
    const overrides = {};
    for (const o of all) overrides[o.id] = {
      points: cfgDirty.overrides[o.id]?.points ?? optCfg(o).points,
      redFlag: cfgDirty.overrides[o.id]?.redFlag ?? optCfg(o).redFlag };
    const r = await api('/api/config', { method:'PUT',
      body: { overrides, thresholds: cfgDirty.thresholds || BOOT.thresholds, recalculate: $('recalc').checked } });
    BOOT.overrides = r.overrides; BOOT.thresholds = r.thresholds;
    cfgDirty = { overrides:{}, thresholds:null };
    toast('Inställningarna är sparade'); viewSettings();
  };
  $('resetCfg').onclick = async () => {
    const overrides = {};
    for (const o of [...FORM.steps.flatMap(stepOptions), ...FORM.labs.flatMap(labItems)])
      overrides[o.id] = { points: o.points ?? 0, redFlag: !!o.redFlag };
    const r = await api('/api/config', { method:'PUT',
      body: { overrides, thresholds: FORM.defaultThresholds, recalculate: true } });
    BOOT.overrides = r.overrides; BOOT.thresholds = r.thresholds;
    cfgDirty = { overrides:{}, thresholds:null };
    toast('Standardvärden återställda'); viewSettings();
  };
  $('toStaff').onclick = () => go('/personal');
}

/* --- ruttning som speglar serverns API --- */
async function demoApi(path, opts = {}) {
  const [route, query] = path.split('?');
  const q = new URLSearchParams(query || '');
  const body = opts.body || {};
  const method = opts.method || 'GET';
  const parts = route.split('/').filter(Boolean);      // ['api','patients','id']

  if (route === '/api/login') {
    const u = DEMO_USERS.find(x => x.username === String(body.username || '').toLowerCase().trim()
                                && x.password === body.password);
    if (!u) err(401, 'Fel användarnamn eller lösenord');
    SESSION = { username:u.username, name:u.name, role:u.role };
    sessionStorage.setItem('priosift-demo-user', u.username);
    return { user: SESSION };
  }
  if (route === '/api/logout') { SESSION = null; sessionStorage.removeItem('priosift-demo-user'); return { ok:true }; }
  if (!SESSION) err(401, 'Ej inloggad');
  const owner = SESSION.role === 'owner';
  const needOwner = () => { if (!owner) err(403, 'Endast administratör kan ändra detta'); };

  if (route === '/api/me') return { user: SESSION };

  if (route === '/api/bootstrap') return {
    user: SESSION, form: DEMO_FORM,
    overrides: DB.overrides, thresholds: DB.thresholds || DEMO_FORM.defaultThresholds,
    tiers: DB.tiers || DEMO_FORM.tiers,
    maxFormScore: maxFormScore(), maxLabScore: maxLabScore(),
    departments: DB.departments
  };

  /* --- avdelningar --- */
  if (route === '/api/departments' && method === 'GET') return { departments: DB.departments };
  if (route === '/api/departments' && method === 'POST') {
    needOwner();
    const id = (body.name || '').toLowerCase().replace(/[^a-z0-9åäö]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
    if (!id) err(400, 'Namn krävs');
    if (DB.departments.some(d => d.id === id)) err(409, 'Det finns redan en avdelning med det namnet');
    const dep = { id, name:body.name, city:body.city || '', tier:Number(body.tier) || 1,
      annual_volume:Number(body.annualVolume) || 0, contact:body.contact || '',
      active: body.active === false ? 0 : 1, created_at:new Date().toISOString() };
    DB.departments.push(dep); await demoSave();
    return { department: dep };
  }
  if (parts[1] === 'departments' && parts[2]) {
    needOwner();
    const dep = DB.departments.find(d => d.id === decodeURIComponent(parts[2]));
    if (!dep) err(404, 'Avdelningen finns inte');
    if (method === 'PATCH') {
      Object.assign(dep, { name:body.name ?? dep.name, city:body.city ?? dep.city,
        tier:Number(body.tier ?? dep.tier), annual_volume:Number(body.annualVolume ?? dep.annual_volume),
        contact:body.contact ?? dep.contact, active: body.active === undefined ? dep.active : (body.active ? 1 : 0) });
      await demoSave(); return { department: dep };
    }
    if (method === 'DELETE') {
      DB.patients = DB.patients.filter(p => p.deptId !== dep.id);
      DB.departments = DB.departments.filter(d => d.id !== dep.id);
      await demoSave(); return { ok:true };
    }
  }

  /* --- patienter --- */
  if (route === '/api/patients' && method === 'GET') {
    const dept = q.get('dept') || 'demo';
    return { patients: DB.patients.filter(p => p.deptId === dept)
      .sort((a, b) => a.level - b.level || new Date(a.createdAt) - new Date(b.createdAt)) };
  }
  if (route === '/api/patients' && method === 'POST') {
    const dept = body.deptId || 'demo';
    const ev = evaluate(body.answers || {}, {});
    const desk = suggestDesk(body.answers || {});
    const p = { id:uid(), deptId:dept, number:demoNumber(dept), createdAt:new Date().toISOString(),
      namn:body.namn || '', pnr:body.pnr || '', answers:body.answers || {}, labs:{},
      formScore:ev.formScore, labScore:ev.labScore, score:ev.score, maxScore:ev.maxScore,
      level:ev.level, autoLevel:ev.level, redFlags:ev.redFlags,
      breakdown:ev.breakdown, labBreakdown:ev.labBreakdown,
      desk, autoDesk:desk, status:'vantar', decision:'', handledBy:'', staffNote:'',
      labsBy:'', labsAt:'', triagedAt:'', closedAt:'' };
    DB.patients.push(p); await demoSave();
    return { id:p.id, number:p.number, level:p.level,
      levelInfo: DEMO_FORM.levels.find(l => l.id === p.level), desk,
      deskName: DEMO_FORM.desks.find(d => d.id === desk).name };
  }
  if (parts[1] === 'patients' && parts[2]) {
    const p = DB.patients.find(x => x.id === decodeURIComponent(parts[2]));
    if (!p) err(404, 'Patienten finns inte');
    if (method === 'GET') return p;
    if (method === 'PATCH') {
      if (body.labs !== undefined) {
        p.labs = body.labs;
        const ev = evaluate(p.answers, p.labs);
        Object.assign(p, { formScore:ev.formScore, labScore:ev.labScore, score:ev.score, maxScore:ev.maxScore,
          level:ev.level, autoLevel:ev.level, redFlags:ev.redFlags,
          breakdown:ev.breakdown, labBreakdown:ev.labBreakdown,
          labsBy: body.labsBy ?? p.labsBy, labsAt:new Date().toISOString() });
      }
      for (const k of ['level','desk','decision','handledBy','staffNote']) if (body[k] !== undefined) p[k] = body[k];
      if (body.status !== undefined) {
        p.status = body.status;
        if (body.status === 'triagerad' && !p.triagedAt) p.triagedAt = new Date().toISOString();
        if (body.status === 'klar') p.closedAt = new Date().toISOString();
      }
      await demoSave(); return p;
    }
    if (method === 'DELETE') {
      DB.patients = DB.patients.filter(x => x.id !== p.id);
      await demoSave(); return { ok:true };
    }
  }

  /* --- väntrum --- */
  if (route === '/api/waiting') {
    const dept = q.get('dept') || 'demo';
    const rows = DB.patients.filter(p => p.deptId === dept && p.status !== 'klar')
      .sort((a, b) => a.level - b.level || new Date(a.createdAt) - new Date(b.createdAt));
    return { updatedAt:new Date().toISOString(), queue: rows.map((p, i) => ({
      number:p.number, level:p.level, desk:p.desk, place:i + 1,
      waitedMinutes: Math.floor((Date.now() - new Date(p.createdAt)) / 60000), status:p.status })) };
  }

  /* --- inställningar --- */
  if (route === '/api/config' && method === 'PUT') {
    needOwner();
    if (body.overrides) DB.overrides = body.overrides;
    if (body.thresholds) DB.thresholds = body.thresholds;
    if (body.tiers) DB.tiers = body.tiers;
    BOOT.overrides = DB.overrides;
    BOOT.thresholds = DB.thresholds || DEMO_FORM.defaultThresholds;
    if (body.recalculate) for (const p of DB.patients) {
      const ev = evaluate(p.answers, p.labs);
      Object.assign(p, { formScore:ev.formScore, labScore:ev.labScore, score:ev.score, maxScore:ev.maxScore,
        level:ev.level, autoLevel:ev.level, redFlags:ev.redFlags,
        breakdown:ev.breakdown, labBreakdown:ev.labBreakdown });
    }
    await demoSave();
    return { ok:true, overrides:DB.overrides, thresholds:DB.thresholds || DEMO_FORM.defaultThresholds,
      tiers:DB.tiers || DEMO_FORM.tiers, maxFormScore:maxFormScore(), maxLabScore:maxLabScore() };
  }
  if (route === '/api/password') return { ok:true };   // demoläge: lösenord kan inte bytas

  /* --- statistik --- */
  if (route === '/api/stats') {
    needOwner();
    const tiers = DB.tiers || DEMO_FORM.tiers;
    const since = d => Date.now() - d * 864e5;
    const out = DB.departments.map(dep => {
      const ps = DB.patients.filter(p => p.deptId === dep.id);
      const n = d => ps.filter(p => new Date(p.createdAt) > since(d)).length;
      const tier = tiers.find(t => t.id === dep.tier) || tiers[0];
      const projected = Math.round(n(30) * 12.17) || dep.annual_volume;
      const correct = tiers.find(t => t.maxVolume === null || projected < t.maxVolume) || tiers[tiers.length - 1];
      const triaged = ps.filter(p => p.triagedAt);
      const levels = {}, desks = {};
      for (const p of ps) { levels[p.level] = (levels[p.level] || 0) + 1; desks[p.desk] = (desks[p.desk] || 0) + 1; }
      return { id:dep.id, name:dep.name, city:dep.city, active:!!dep.active, tier:dep.tier,
        tierName:tier.name, priceMonth:tier.priceMonth, annualVolume:dep.annual_volume,
        total:ps.length, d1:n(1), d7:n(7), d30:n(30), projectedAnnual:projected,
        suggestedTier:correct.id, tierMismatch: correct.id !== dep.tier, levels, desks,
        avgTriageMinutes: triaged.length
          ? Math.round(triaged.reduce((a, p) => a + (new Date(p.triagedAt) - new Date(p.createdAt)) / 60000, 0) / triaged.length)
          : null };
    });
    const monthly = out.filter(d => d.active).reduce((a, d) => a + d.priceMonth, 0);
    return { departments:out, tiers, totals:{ monthlyRevenue:monthly, annualRevenue:monthly * 12,
      patients: out.reduce((a, d) => a + d.total, 0), active: out.filter(d => d.active).length } };
  }

  err(404, 'Okänd endpoint i demoläget');
}

async function viewCosmicPreview(patientId) {
  if (!patientId) {
    // show picker from the current dept
    const r = await api('/api/patients?dept=' + DEPT);
    const patients = r.filter(p => p.status !== 'avslutad');
    shell(`<div class="cosmic-preview-wrap">
      <h2>Cosmic-förhandsvisning</h2>
      <p class="muted">Välj en patient för att se hur datan ser ut inför överföring till Cosmic.</p>
      <div style="margin-top:24px;display:flex;flex-direction:column;gap:10px">
        ${patients.map(p => `<button class="btn ghost" style="text-align:left;padding:14px 18px;border-radius:12px;border:1px solid var(--line)" data-id="${p.id}">
          <strong>${esc(p.number)}</strong> ${p.namn ? '– ' + esc(p.namn) : ''}
          <span class="muted" style="font-size:13px;margin-left:8px">Nivå ${p.level} · ${esc(p.desk)}</span>
        </button>`).join('')}
        ${!patients.length ? '<p class="muted">Inga aktiva patienter att visa.</p>' : ''}
      </div>
    </div>`, { title:'Cosmic Preview', icon:'patient' });
    document.querySelectorAll('[data-id]').forEach(btn =>
      btn.onclick = () => go('/cosmic-preview/' + btn.dataset.id));
    return;
  }

  // Show preview for specific patient
  try {
    const data = await api('/api/cosmic/preview/' + patientId);
    shell(`<div class="cosmic-preview-wrap">
      <button class="btn ghost small" onclick="go('/cosmic-preview')" style="margin-bottom:20px">← Välj annan patient</button>
      <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:6px">
        <h2 style="margin:0">Patient ${esc(data.number)}</h2>
        ${data.namn ? `<span class="muted">${esc(data.namn)}</span>` : ''}
        ${data.pnrMasked ? `<span class="muted" style="font-size:13px;font-family:monospace">PNR: ${esc(data.pnrMasked)}</span>` : ''}
        ${data.patientId ? `<span class="muted" style="font-size:13px;font-family:monospace">ID: ${esc(data.patientId)}</span>` : ''}
      </div>
      <p class="muted" style="margin-bottom:20px;font-size:14px">
        Cosmic-integration: ${data.cosmicEnabled ? '<span style="color:var(--lvl4)">● Aktiv</span>' : '<span style="color:var(--ink-3)">● Ej aktiverad (testläge)</span>'}
      </p>

      <h3 style="margin:0 0 10px;font-size:16px">Journaltext (narrativ)</h3>
      <div class="narrative-box">${esc(data.narrativeText)}</div>

      <h3 style="margin:20px 0 10px;font-size:16px">FHIR Bundle (Cambio COS – Transaction Bundle med QuestionnaireResponse + Observations)</h3>
      <div class="fhir-box">${esc(JSON.stringify(data.fhirBundle, null, 2))}</div>
      <p class="muted" style="font-size:13px;margin-top:8px">Bundlen innehåller ${data.vitalCount} vitalobservation${data.vitalCount !== 1 ? 'er' : ''} med Cambio COS-profiler.</p>

      ${data.cosmicEnabled ? `
      <button class="btn" id="pushBtn" style="margin-top:24px">Skicka till Cosmic</button>
      <div id="pushMsg" style="margin-top:12px"></div>` : `
      <p class="muted" style="margin-top:20px;font-size:14px;padding:14px;background:var(--surface-2);border-radius:10px">
        Sätt <code>COSMIC_ENABLED=true</code> och Cosmic API-nycklar i miljövariabler för att aktivera Cosmic-push.
      </p>`}
    </div>`, { title:'Cosmic Preview', icon:'patient' });

    if (data.cosmicEnabled) {
      document.getElementById('pushBtn').onclick = async () => {
        document.getElementById('pushBtn').disabled = true;
        document.getElementById('pushMsg').textContent = 'Skickar...';
        try {
          const r = await api('/api/cosmic/push/' + patientId, { method:'POST' });
          document.getElementById('pushMsg').innerHTML = '<span style="color:var(--lvl4)">✓ Skickat till Cambio Cosmic (Bundle-ID: ' + esc(r.bundleId || r.questionnaireId || '–') + ', ' + (r.entriesSent||0) + ' resurser)</span>';
        } catch(e) {
          document.getElementById('pushMsg').innerHTML = '<span style="color:var(--lvl1)">Fel: ' + esc(e.message) + '</span>';
          document.getElementById('pushBtn').disabled = false;
        }
      };
    }
  } catch(e) {
    shell('<div class="cosmic-preview-wrap"><p style="color:var(--lvl1)">Fel: ' + esc(e.message) + '</p></div>', { title:'Cosmic Preview', icon:'patient' });
  }
}
